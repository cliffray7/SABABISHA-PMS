services:
  - type: web
    name: sababisha-pms-api
    runtime: docker
    dockerfilePath: infrastructure/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__PmsDatabase
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: FrontendUrl
        sync: false
      - key: Brevo__ApiKey
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: Gemini__Model
        value: gemini-3.8-flash
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Brevo__From
        sync: false
      - key: Brevo__FromName
        value: TaskFlow
      - key: Uploads__Path
        value: /app/data/uploads
      - key: Operations__AdminUserIds__0
        sync: false
    disk:
      name: attachments
      mountPath: /app/data
      sizeGB: 1

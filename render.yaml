services:
  - type: web
    name: sababisha-pms-api
    runtime: docker
    dockerfilePath: infrastructure/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__PmsDatabase
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: FrontendUrl
        sync: false
      - key: Smtp__Host
        value: smtp-relay.brevo.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__EnableSsl
        value: "false"
      - key: Smtp__From
        sync: false
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Uploads__Path
        value: /app/data/uploads
    disk:
      name: attachments
      mountPath: /app/data
      sizeGB: 1

name: sababisha_pms_mobile
description: Sababisha PMS mobile client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Storage & networking
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # State management
  provider: ^6.1.2

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  timeago: ^3.7.0

  # Icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeded', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('accessToken', pm.response.json().accessToken);
order: 2000

name: Build and test

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: dotnet restore Sababisha.Pms.slnx
      - run: dotnet build Sababisha.Pms.slnx --no-restore --configuration Release
      - run: dotnet test Sababisha.Pms.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx --yes newman run tests/Pms.ApiTests/postman/pms-api.postman_collection.json --environment tests/Pms.ApiTests/postman/local.postman_environment.json --reporters cli
        continue-on-error: true